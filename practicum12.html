<!DOCTYPE html>
<html>
<head>
    <title>Urban Bloom - Plant Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f1f7ed;
            margin: 0;
            text-align: center;
        }

        header {
            background-color: #285c36;
            color: white;
            padding: 20px;
        }

        .container {
            background-color: white;
            width: 80%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        input, select {
            padding: 10px;
            margin: 8px;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            background-color: #3d804b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }

        button:hover {
            background-color: #245a32;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            border: 1px solid #ccc;
            padding: 12px;
        }

        th {
            background-color: #dcebd8;
        }

        footer {
            background-color: #285c36;
            color: white;
            padding: 12px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Urban Bloom</h1>
        <h3>Smart Plant Management System</h3>
    </header>

    <div class="container">

        <h2>Manage Your Plants</h2>

        <input type="text" id="plantName"
               placeholder="Enter Plant Name">

        <select id="category">
            <option value="">Select Category</option>
            <option value="Flowering">Flowering</option>
            <option value="Indoor">Indoor</option>
            <option value="Outdoor">Outdoor</option>
            <option value="Medicinal">Medicinal</option>
        </select>

        <br>

        <button onclick="addPlant()">Add Plant</button>

        <button onclick="getPlants()">View Plants</button>

        <h2>Plant Details</h2>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Plant Name</th>
                    <th>Category</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="plantList">
            </tbody>
        </table>

        <p id="message"></p>

    </div>

    <footer>
        © Rights Reserved by URBAN BLOOM
    </footer>

    <script>

        let plants = [];

        const api = "https://jsonplaceholder.typicode.com/posts";

        // GET - Fetch Plants
        function getPlants() {

            fetch(api)
            .then(response => response.json())
            .then(data => {

                plants = data.slice(0, 5).map(p => ({
                    id: p.id,
                    name: p.title.substring(0, 15),
                    category: "Indoor"
                }));

                displayPlants();

                document.getElementById("message").innerHTML =
                    "Plant details fetched successfully!";
            })
            .catch(error => {
                document.getElementById("message").innerHTML =
                    "Error fetching data!";
            });
        }

        // Display Plants
        function displayPlants() {

            let output = "";

            plants.forEach(plant => {

                output += `
                    <tr>
                        <td>${plant.id}</td>
                        <td>${plant.name}</td>
                        <td>${plant.category}</td>
                        <td>
                            <button onclick="updatePlant(${plant.id})">
                                Update
                            </button>

                            <button onclick="deletePlant(${plant.id})">
                                Delete
                            </button>
                        </td>
                    </tr>
                `;

            });

            document.getElementById("plantList").innerHTML = output;
        }

        // POST - Add Plant
        function addPlant() {

            let name = document.getElementById("plantName").value;
            let category = document.getElementById("category").value;

            if (name === "" || category === "") {
                alert("Please enter all details!");
                return;
            }

            fetch(api, {
                method: "POST",
                body: JSON.stringify({
                    title: name,
                    category: category
                }),
                headers: {
                    "Content-type": "application/json"
                }
            })
            .then(response => response.json())
            .then(data => {

                plants.push({
                    id: data.id,
                    name: name,
                    category: category
                });

                displayPlants();

                document.getElementById("plantName").value = "";
                document.getElementById("category").value = "";

                document.getElementById("message").innerHTML =
                    "Plant added successfully!";
            });
        }

        // PUT - Update Plant
        function updatePlant(id) {

            let name = prompt("Enter new plant name:");

            if (name === null || name.trim() === "") {
                return;
            }

            fetch(api + "/" + id, {
                method: "PUT",
                body: JSON.stringify({
                    title: name
                }),
                headers: {
                    "Content-type": "application/json"
                }
            })
            .then(response => response.json())
            .then(data => {

                let plant = plants.find(p => p.id === id);

                if (plant) {
                    plant.name = name;
                }

                displayPlants();

                document.getElementById("message").innerHTML =
                    "Plant updated successfully!";
            });
        }

        // DELETE - Remove Plant
        function deletePlant(id) {

            fetch(api + "/" + id, {
                method: "DELETE"
            })
            .then(() => {

                plants = plants.filter(p => p.id !== id);

                displayPlants();

                document.getElementById("message").innerHTML =
                    "Plant deleted successfully!";
            });
        }

    </script>

</body>
</html>
